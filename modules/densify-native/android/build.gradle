plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.densifynative'
version = '0.2.0'

android {
  namespace "expo.modules.densifynative"
  defaultConfig {
    versionCode 1
    versionName "0.2.0"
  }
}

dependencies {
  // On-device ADB over Wireless Debugging. Published on JitPack (the app adds https://www.jitpack.io via expo-build-properties).
  implementation "com.github.MuntashirAkon:libadb-android:3.1.1"
  implementation "com.github.MuntashirAkon:sun-security-android:1.1"
  implementation "org.conscrypt:conscrypt-android:2.5.3"
}
